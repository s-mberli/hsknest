name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: file:./ci.db
      NEXTAUTH_SECRET: ci-secret
      NEXTAUTH_URL: http://localhost:3000
      # Build the flag-on path too — this is a build-time-inlined flag (see
      # src/lib/ninja/flag.ts), so a build with it unset never actually
      # compiles the enabled code path.
      NEXT_PUBLIC_ENABLE_NINJA: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --run

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test

    env:
      DATABASE_URL: file:./e2e.db
      NEXTAUTH_SECRET: ci-secret
      NEXTAUTH_URL: http://localhost:3000
      # The journey suite creates many accounts and exercises guest mode —
      # both are gated to a single claim on self-hosted instances (see
      # src/lib/registration.ts). Reopen registration so the suite still
      # covers the self-hosted path end-to-end.
      ALLOW_REGISTRATION: "true"
      # Word Ninja is a build-time-inlined flag (src/lib/ninja/flag.ts) —
      # without this, CI never builds or exercises the flag-on path at all.
      # Inherited by both `npm run dev` (via playwright.config.ts's
      # webServer, which merges into process.env) and the test file itself
      # (journey.spec.ts reads it to decide which ninja tests to run).
      NEXT_PUBLIC_ENABLE_NINJA: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Migrate + seed the e2e database
        run: |
          npx prisma migrate deploy
          npx prisma db seed

      # Chromium only — the suite runs against one browser (see
      # playwright.config.ts); installing the rest would just slow CI down.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e tests
        run: npm run test:e2e
