name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: file:./ci.db
      NEXTAUTH_SECRET: ci-secret
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        # high threshold currently trips on deepmerge-ts (GHSA-ggr8-5vv4-36mx),
        # a transitive dep of the Prisma CLI's config loader only — not reachable
        # from @prisma/client at runtime, and no Prisma release fixes it yet
        # (checked up to prisma@7.9.1, 2026-08-18). Gate on critical until
        # upstream bumps deepmerge-ts to >=8.0.0.
        run: npm audit --audit-level=critical

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --run

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test

    env:
      DATABASE_URL: file:./e2e.db
      NEXTAUTH_SECRET: ci-secret
      NEXTAUTH_URL: http://localhost:3000
      # The journey suite creates many accounts and exercises guest mode —
      # both are gated to a single claim on self-hosted instances (see
      # src/lib/registration.ts). Reopen registration so the suite still
      # covers the self-hosted path end-to-end.
      ALLOW_REGISTRATION: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Migrate + seed the e2e database
        run: |
          npx prisma migrate deploy
          npx prisma db seed

      # Chromium only — the suite runs against one browser (see
      # playwright.config.ts); installing the rest would just slow CI down.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e tests
        run: npm run test:e2e
