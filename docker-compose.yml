services:
  app:
    build:
      context: .
      args:
        # NEXT_PUBLIC_* vars must be passed as a build arg (see Dockerfile) —
        # the `environment:` block below is runtime-only, too late for these.
        NEXT_PUBLIC_AUDIO_BASE_URL: ${NEXT_PUBLIC_AUDIO_BASE_URL:-}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_UMAMI_URL: ${NEXT_PUBLIC_UMAMI_URL:-}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # SQLite database on the named volume mounted at /data.
      DATABASE_URL: file:/data/recall.db
      # Generate a strong secret: `openssl rand -base64 32`.
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in your .env}
      # Public URL the app is served from (behind your reverse proxy).
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      # Same URL, used in emailed links (password reset / verification).
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-${NEXTAUTH_URL:-http://localhost:3000}}
      # Seed/refresh starter word lists on every boot. Idempotent — safe to
      # leave on; only adds/updates seeded (createdById=null) content.
      AUTO_SEED: ${AUTO_SEED:-true}
      # Self-hosted only: the first account to sign up claims the instance,
      # then registration (and guest mode) closes automatically. Set to
      # "true" to reopen both — e.g. to add a second household account.
      # Fails CLOSED like AUTO_SEED fails open: unset or anything other than
      # "true" keeps registration closed.
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      # Optional: enables real email delivery for password reset / email
      # verification via Resend (https://resend.com). Without it, links are
      # logged to the container's stdout instead of emailed.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@hsknest.com}
      # Self-hosted stays "true" (the default): no trials, no paywall, no
      # Stripe. Only the managed hosted instance ever sets this to "false".
      SELF_HOSTED: ${SELF_HOSTED:-true}
      # Hosted instance only — ignored while SELF_HOSTED=true.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Which audio packs to download from GitHub Releases on boot (see
      # docs/AUDIO.md). Defaults to "stories" (~10MB, Reading Mode
      # narration) if unset. Space-separated: "stories words sentences".
      # Set to an empty string to skip audio entirely (Web Speech fallback).
      AUDIO_PACKS: ${AUDIO_PACKS-stories}
      # Override only if you maintain a fork with its own audio releases.
      AUDIO_PACK_REPO: ${AUDIO_PACK_REPO:-s-mberli/hsknest}
      # Ingest Reading Mode's graded stories on every boot (idempotent).
      # Set to exactly "false" to skip it on a stripped-down instance;
      # existing reading progress and enrolled words are untouched either
      # way, only future re-ingests are skipped.
      READING_MODE_ENABLED: ${READING_MODE_ENABLED:-true}
      # Optional operator page (/mb-admin) + cookieless Umami analytics.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      NEXT_PUBLIC_UMAMI_URL: ${NEXT_PUBLIC_UMAMI_URL:-}
      NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
      # Optional error tracking + tracing (Sentry). SENTRY_DSN is read at
      # runtime by the server/edge SDK — it MUST be in this block, not just
      # build args, or server-side errors are logged but never sent.
      # NEXT_PUBLIC_SENTRY_DSN is build-time inlined (see build.args) but is
      # listed here too for completeness.
      SENTRY_DSN: ${SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    volumes:
      - recall-data:/data
      - recall-audio:/app/public/audio
    healthcheck:
      # Real DB round-trip (see src/app/api/health/route.ts), not just "is
      # the process alive" — catches a hung or DB-broken container so
      # `restart: unless-stopped` and dependents can actually react.
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  sqlite-backup:
    image: alpine:3.20
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - recall-data:/data
      - ./backups:/backups
    command: >
      sh -c 'apk add --no-cache sqlite &&
      echo "#!/bin/sh" > /backup.sh &&
      echo "sqlite3 /data/recall.db \".backup /backups/recall-backup-$$(date +%Y%m%d).db\"" >> /backup.sh &&
      echo "find /backups -name \"recall-backup-*.db\" -mtime +7 -exec rm {} \\;" >> /backup.sh &&
      chmod +x /backup.sh &&
      echo "0 2 * * * /backup.sh" > /etc/crontabs/root &&
      crond -f -d 8'

volumes:
  recall-data:
  # Pre-generated pronunciation MP3s (see docs/AUDIO.md) — a named volume so
  # they survive redeploys instead of living in the container's writable
  # layer, which Coolify replaces on every deploy.
  recall-audio:
